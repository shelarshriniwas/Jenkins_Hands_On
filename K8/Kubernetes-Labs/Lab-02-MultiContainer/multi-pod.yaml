apiVersion: v1
kind: Pod
metadata:
  name: multi-container-pod
spec:
  containers:
  - name: multi-cont
    image: nginx:latest
    ports:
      - containerPort: 80

  - name: busybox
    image: busybox:latest
    command:
      - sh
      - -c
      - |
        while true
        do
          echo "Container is running ... "
          sleep 5
        done 